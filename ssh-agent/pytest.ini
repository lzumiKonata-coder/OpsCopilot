[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: 需要真实数据库、SSE 或终端模拟的集成测试
filterwarnings =
    # aiosqlite 连接在 pytest-asyncio 临时事件循环关闭后被 GC 兜底回收，
    # 属测试基础设施时序噪音，非业务连接泄漏；测试已统一使用 NullPool 与显式 session 关闭
    ignore:The garbage collector is trying to clean up non-checked-in connection:sqlalchemy.exc.SAWarning
